limit_req_zone $binary_remote_addr zone=accounts:10m rate=30r/m;
server {
    listen 8080;
    server_name _;
    # This listener is private; only cloudflared reaches it from the Docker network.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Admin remains available only through the host's loopback port 18000.
    location ~* ^/(admin(?:/|$)|api/admin(?:/|$)|admin-info(?:/|$)|docs(?:/|$)|redoc(?:/|$)|openapi\.json$|warm_pool$|reset_pools$|generate$|log$) { return 404; }
    location ~* (^|/)(\.state|\.env|\.git|package_backups|opencode_package_backups)(/|$) { return 404; }
    location ~* ^/data/(runtime|game_build_cache)(/|$) { return 404; }
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=accounts burst=60 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
